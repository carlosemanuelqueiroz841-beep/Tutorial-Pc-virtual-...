

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    user-select: none;
  }

  /* DESKTOP */
  #desktop {
    position: relative;
    width: 100%;
    height: calc(100vh - 50px);
    padding: 20px;
  }

  .icon {
    width: 80px;
    height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 10px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    transition: background 0.15s;
  }
  .icon:hover { background: rgba(255,255,255,0.2); }
  .icon .emoji { font-size: 38px; margin-bottom: 4px; }
  .icon .label { font-size: 12px; text-align: center; }

  /* BARRA DE TAREFAS */
  #taskbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: rgba(20, 20, 30, 0.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    z-index: 10000;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  #startBtn {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  #startBtn:hover { transform: scale(1.08); }
  #startBtn.active { background: linear-gradient(135deg, #764ba2, #f093fb); }

  #taskbarApps { display: flex; gap: 6px; flex: 1; }

  .taskbar-app {
    min-width: 40px;
    height: 40px;
    padding: 0 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    transition: background 0.15s;
    border-bottom: 2px solid transparent;
  }
  .taskbar-app:hover { background: rgba(255,255,255,0.18); }
  .taskbar-app.active { background: rgba(102,126,234,0.5); border-bottom-color: #667eea; }

  #clock {
    color: white;
    font-size: 13px;
    text-align: center;
    padding: 0 12px;
    line-height: 1.2;
  }

  /* MENU INICIAR */
  #startMenu {
    position: fixed;
    bottom: 58px;
    left: 10px;
    width: 320px;
    max-height: 500px;
    background: rgba(25, 25, 40, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 16px;
    z-index: 10001;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    display: none;
    overflow-y: auto;
  }
  #startMenu.open { display: block; animation: slideUp 0.2s ease; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #startMenu h3 {
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .start-app {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s;
  }
  .start-app:hover { background: rgba(102,126,234,0.4); }
  .start-app .emoji { font-size: 22px; }

  /* JANELAS */
  .window {
    position: absolute;
    min-width: 300px;
    min-height: 200px;
    background: #1e1e2e;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    animation: windowOpen 0.2s ease;
  }
  @keyframes windowOpen {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .window-header {
    height: 38px;
    background: linear-gradient(135deg, #2a2a3e, #1e1e2e);
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: move;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .window-title {
    color: #fff;
    font-size: 13px;
    flex: 1;
    margin-left: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .window-icon { font-size: 16px; }
  .window-controls { display: flex; gap: 6px; }
  .win-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .win-btn.min { background: #f5a623; }
  .win-btn.max { background: #4caf50; }
  .win-btn.close { background: #e53935; }
  .win-btn:hover { filter: brightness(1.2); }

  .window-body {
    flex: 1;
    overflow: auto;
    color: #ddd;
    background: #16161e;
  }
  .window-body::-webkit-scrollbar { width: 8px; }
  .window-body::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  /* APP: Notepad */
  .notepad {
    width: 100%;
    height: 100%;
    background: #1e1e2e;
    color: #ddd;
    border: none;
    outline: none;
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    resize: none;
  }

  /* APP: Calculadora */
  .calc { padding: 12px; background: #1a1a2e; }
  .calc-display {
    width: 100%;
    height: 60px;
    background: #0f0f1a;
    color: #fff;
    font-size: 24px;
    text-align: right;
    padding: 10px;
    border: none;
    outline: none;
    border-radius: 8px;
    margin-bottom: 10px;
    font-family: 'Consolas', monospace;
  }
  .calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .calc-btn {
    height: 50px;
    border: none;
    border-radius: 8px;
    background: #2a2a3e;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .calc-btn:hover { background: #3a3a5e; }
  .calc-btn.op { background: #ff9500; }
  .calc-btn.op:hover { background: #ffb040; }
  .calc-btn.eq { background: #667eea; }
  .calc-btn.eq:hover { background: #7b8ff0; }
  .calc-btn.clear { background: #e53935; }

  /* APP: Terminal */
  .terminal {
    width: 100%;
    height: 100%;
    background: #0a0a14;
    color: #0f0;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .term-output { flex: 1; white-space: pre-wrap; line-height: 1.5; }
  .term-input-line { display: flex; align-items: center; }
  .term-prompt { color: #667eea; margin-right: 6px; }
  .term-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #0f0;
    font-family: inherit;
    font-size: inherit;
  }

  /* APP: Navegador */
  .browser { display: flex; flex-direction: column; height: 100%; background: #fff; }
  .browser-bar { padding: 8px; background: #2a2a3e; display: flex; gap: 6px; }
  .browser-bar input {
    flex: 1;
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    outline: none;
    background: #16161e;
    color: #fff;
  }
  .browser-bar button {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: #667eea;
    color: white;
    cursor: pointer;
  }
  .browser-frame { flex: 1; border: none; background: #fff; }

  /* APP: Configurações */
  .settings { padding: 20px; color: #ddd; }
  .settings h2 { margin-bottom: 16px; font-size: 18px; }
  .settings label { display: block; margin: 12px 0 6px; font-size: 13px; }
  .settings input[type="color"] {
    width: 60px; height: 40px; border: none; border-radius: 6px; cursor: pointer;
  }
  .settings .wallpaper-btn {
    padding: 8px 14px; border-radius: 6px; border: none;
    background: #667eea; color: white; cursor: pointer; margin-top: 8px;
  }

  /* APP: Jogo da Velha */
  .tictactoe { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ttt-grid {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 4px;
  }
  .ttt-cell {
    width: 80px; height: 80px; border: none; border-radius: 8px;
    background: #2a2a3e; color: #fff; font-size: 40px;
    cursor: pointer; transition: background 0.15s;
  }
  .ttt-cell:hover { background: #3a3a5e; }
  .ttt-status { color: #fff; font-size: 16px; }
  .ttt-reset {
    padding: 8px 20px; border: none; border-radius: 6px;
    background: #667eea; color: white; cursor: pointer;
  }

  /* APP: Snake */
  .snake { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .snake canvas { background: #0f0f1a; border-radius: 8px; }
  .snake-info { color: #fff; font-size: 14px; }
  .snake-btn {
    padding: 6px 16px; border: none; border-radius: 6px;
    background: #667eea; color: #fff; cursor: pointer;
  }

  .app-info { padding: 20px; color: #ddd; font-size: 14px; line-height: 1.6; }
  .app-info h2 { color: #fff; margin-bottom: 10px; font-size: 18px; }
</style>
</head>
<body>

<div id="desktop"></div>

<div id="taskbar">
  <button id="startBtn">⊞</button>
  <div id="taskbarApps"></div>
  <div id="clock"></div>
</div>

<div id="startMenu">
  <h3>📋 Aplicativos</h3>
  <div id="startApps"></div>
</div>

<script>
/* ================= GERENCIADOR DE APPS ================= */
const apps = {
  notepad:   { name: 'Bloco de Notas', emoji: '📝', width: 500, height: 400 },
  calc:      { name: 'Calculadora',    emoji: '🧮', width: 320, height: 440 },
  terminal:  { name: 'Terminal',       emoji: '💻', width: 600, height: 380 },
  browser:   { name: 'Navegador',      emoji: '🌐', width: 700, height: 500 },
  settings:  { name: 'Configurações',  emoji: '⚙️', width: 420, height: 400 },
  tictactoe: { name: 'Jogo da Velha',  emoji: '⭕', width: 320, height: 420 },
  snake:     { name: 'Snake Game',     emoji: '🐍', width: 400, height: 480 },
  about:     { name: 'Sobre o WebOS',  emoji: 'ℹ️', width: 420, height: 340 }
};

let zIndex = 100;
const openWindows = {}; // id -> { el, taskbarBtn, minimized }
let winIdCounter = 0;

/* ================= DESKTOP ================= */
const desktop = document.getElementById('desktop');
const taskbarApps = document.getElementById('taskbarApps');
const startApps = document.getElementById('startApps');
const startMenu = document.getElementById('startMenu');
const startBtn = document.getElementById('startBtn');

Object.keys(apps).forEach(key => {
  const app = apps[key];

  // Ícone no desktop
  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.innerHTML = `<div class="emoji">${app.emoji}</div><div class="label">${app.name}</div>`;
  icon.addEventListener('dblclick', () => openApp(key));
  desktop.appendChild(icon);

  // Item no menu iniciar
  const startItem = document.createElement('div');
  startItem.className = 'start-app';
  startItem.innerHTML = `<span class="emoji">${app.emoji}</span><span>${app.name}</span>`;
  startItem.addEventListener('click', () => { openApp(key); closeStartMenu(); });
  startApps.appendChild(startItem);
});

/* ================= ABRIR APP ================= */
function openApp(key) {
  const app = apps[key];

  // Se já aberto, foca
  if (openWindows[key]) {
    const w = openWindows[key];
    if (w.minimized) { w.el.style.display = 'flex'; w.minimized = false; }
    w.el.style.zIndex = ++zIndex;
    updateTaskbarFocus(key);
    return;
  }

  const win = document.createElement('div');
  win.className = 'window';
  win.style.width = app.width + 'px';
  win.style.height = app.height + 'px';
  win.style.left = Math.min(100 + winIdCounter * 30, window.innerWidth - app.width - 30) + 'px';
  win.style.top = Math.min(60 + winIdCounter * 30, window.innerHeight - app.height - 80) + 'px';
  win.style.zIndex = ++zIndex;
  winIdCounter++;

  // Header
  const header = document.createElement('div');
  header.className = 'window-header';
  header.innerHTML = `
    <span class="window-icon">${app.emoji}</span>
    <span class="window-title">${app.name}</span>
    <div class="window-controls">
      <button class="win-btn min" title="Minimizar">—</button>
      <button class="win-btn max" title="Maximizar">□</button>
      <button class="win-btn close" title="Fechar">✕</button>
    </div>
  `;
  win.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'window-body';
  win.appendChild(body);
  buildAppContent(key, body);

  // Botões
  header.querySelector('.close').addEventListener('click', () => closeApp(key));
  header.querySelector('.min').addEventListener('click', () => minimizeApp(key));
  header.querySelector('.max').addEventListener('click', () => toggleMaximize(key, win));
  header.addEventListener('mousedown', () => { win.style.zIndex = ++zIndex; });

  // Arrastar
  makeDraggable(win, header);

  desktop.appendChild(win);

  // Botão na taskbar
  const tbBtn = document.createElement('button');
  tbBtn.className = 'taskbar-app active';
  tbBtn.innerHTML = `<span>${app.emoji}</span>`;
  tbBtn.title = app.name;
  tbBtn.addEventListener('click', () => {
    const w = openWindows[key];
    if (!w) return;
    if (w.el.style.zIndex === String(getMaxZ())) {
      minimizeApp(key);
    } else {
      if (w.minimized) { w.el.style.display = 'flex'; w.minimized = false; }
      w.el.style.zIndex = ++zIndex;
      updateTaskbarFocus(key);
    }
  });
  taskbarApps.appendChild(tbBtn);

  openWindows[key] = { el: win, taskbarBtn: tbBtn, minimized: false, maximized: false, prevRect: null };
  updateTaskbarFocus(key);
}

function getMaxZ() {
  let max = 0;
  Object.values(openWindows).forEach(w => {
    if (w.el.style.display !== 'none') {
      max = Math.max(max, parseInt(w.el.style.zIndex) || 0);
    }
  });
  return max;
}

function updateTaskbarFocus(key) {
  Object.keys(openWindows).forEach(k => {
    openWindows[k].taskbarBtn.classList.toggle('active', k === key && !openWindows[k].minimized);
  });
}

function closeApp(key) {
  const w = openWindows[key];
  if (!w) return;
  w.el.remove();
  w.taskbarBtn.remove();
  delete openWindows[key];
}

function minimizeApp(key) {
  const w = openWindows[key];
  w.el.style.display = 'none';
  w.minimized = true;
  updateTaskbarFocus(null);
}

function toggleMaximize(key, win) {
  const w = openWindows[key];
  if (!w.maximized) {
    w.prevRect = { left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height };
    win.style.left = '0px';
    win.style.top = '0px';
    win.style.width = '100%';
    win.style.height = 'calc(100vh - 50px)';
    w.maximized = true;
  } else {
    Object.assign(win.style, w.prevRect);
    w.maximized = false;
  }
}

/* ================= DRAG ================= */
function makeDraggable(win, handle) {
  let isDragging = false, startX, startY, startLeft, startTop;

  handle.addEventListener('mousedown', e => {
    if (e.target.closest('.win-btn')) return;
    isDragging = true;
    const w = Object.values(openWindows).find(o => o.el === win);
    if (w &&
