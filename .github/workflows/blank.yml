name: High-Performance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: # Permite execução manual para testes

jobs:
  build:
    # Usa a versão mais recente do Ubuntu, garantindo kernel e drivers atualizados
    runs-on: ubuntu-latest
    
    # Libera espaço em disco extra (útil para builds pesados)
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify hardware specs
        run: |
          echo "--- CPU Info ---"
          lscpu | grep "Model name"
          echo "--- Memory ---"
          free -h
          echo "--- Disk Space ---"
          df -h /

      # Exemplo de instalação de dependências pesadas
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          
      # Seu código de build/teste entra aqui
      - name: Run Build
        run: |
          echo "Executando build de alta performance..."
