name: VM 32GB + RTX 3060 (SSH)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  provision-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar sshpass (para autenticação por senha)
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Testar conexão SSH
        env:
          HOST: ${{ secrets.VM_HOST }}
          USERNAME: ${{ secrets.VM_USER }}
          PASSWORD: ${{ secrets.VM_PASSWORD }}
          PORT: ${{ secrets.VM_PORT }}   # opcional, padrão 22
        run: |
          : "${PORT:=22}"
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no \
            -p "$PORT" "$USERNAME@$HOST" "echo 'Conexão OK em' \$(hostname)"

      - name: Verificar hardware remoto (RAM + GPU)
        env:
          HOST: ${{ secrets.VM_HOST }}
          USERNAME: ${{ secrets.VM_USER }}
          PASSWORD: ${{ secrets.VM_PASSWORD }}
          PORT: ${{ secrets.VM_PORT }}
        run: |
          : "${PORT:=22}"
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no \
            -p "$PORT" "$USERNAME@$HOST" bash -s <<'EOF'
              echo "===== HOST ====="
              hostname
              echo "===== RAM ====="
              free -h
              echo "===== GPU ====="
              nvidia-smi --query-gpu=name,memory.total,driver_version \
                         --format=csv
              echo "===== DISCO ====="
              df -h /
          EOF

      - name: Validar 32GB RAM + RTX 3060
        env:
          HOST: ${{ secrets.VM_HOST }}
          USERNAME: ${{ secrets.VM_USER }}
          PASSWORD: ${{ secrets.VM_PASSWORD }}
          PORT: ${{ secrets.VM_PORT }}
        run: |
          : "${PORT:=22}"
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no \
            -p "$PORT" "$USERNAME@$HOST" bash -s <<'EOF'
              RAM_GB=$(free -g | awk '/^Mem:/{print $2}')
              GPU=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -n1)
              echo "RAM: ${RAM_GB} GB | GPU: ${GPU}"
              [ "$RAM_GB" -ge 30 ] || { echo "::error::RAM < 32GB"; exit 1; }
              echo "$GPU" | grep -qi "3060" || { echo "::error::GPU não é RTX 3060"; exit 1; }
              echo "✅ Hardware validado"
          EOF

      - name: Rodar comandos do projeto na VM
        env:
          HOST: ${{ secrets.VM_HOST }}
          USERNAME: ${{ secrets.VM_USER }}
          PASSWORD: ${{ secrets.VM_PASSWORD }}
          PORT: ${{ secrets.VM_PORT }}
        run: |
          : "${PORT:=22}"
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no \
            -p "$PORT" "$USERNAME@$HOST" bash -s <<'EOF'
              set -e
              echo "Executando build/teste na VM..."
              cd ~/projeto || { echo "Pasta ~/projeto não existe"; exit 1; }
              # Exemplo:
              # git pull
              # python3 -m venv .venv && source .venv/bin/activate
              # pip install -r requirements.txt
              # python train.py
              echo "OK"
          EOF
