name: PC Virtual 32GB + RTX 3060

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  gpu-job:
    # ⚠️ OBRIGATÓRIO: só funciona com runner self-hosted que tenha a RTX 3060
    # Para runners hospedados pelo GitHub (sem GPU), troque por: ubuntu-latest
    runs-on: [self-hosted, linux, x64, gpu, rtx3060]

    # Timeout generoso para builds pesados
    timeout-minutes: 120

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar hardware (CPU / RAM / Disco)
        run: |
          echo "===== CPU ====="
          lscpu | grep -E "Model name|CPU\(s\)|Thread|Core"
          echo ""
          echo "===== MEMÓRIA (esperado ~32GB) ====="
          free -h
          echo ""
          echo "===== DISCO ====="
          df -h /

      - name: Verificar GPU (RTX 3060)
        run: |
          echo "===== GPUs detectadas ====="
          if command -v nvidia-smi &> /dev/null; then
            nvidia-smi
            echo ""
            echo "===== Detalhes da GPU ====="
            nvidia-smi --query-gpu=name,memory.total,driver_version,cuda_version \
                       --format=csv
          else
            echo "ERRO: nvidia-smi não encontrado. Instale os drivers NVIDIA no runner."
            exit 1
          fi

      - name: Validar requisitos mínimos (32GB RAM + RTX 3060)
        run: |
          RAM_GB=$(free -g | awk '/^Mem:/{print $2}')
          GPU_NAME=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -n1)

          echo "RAM detectada: ${RAM_GB} GB"
          echo "GPU detectada: ${GPU_NAME}"

          if [ "$RAM_GB" -lt 30 ]; then
            echo "::error::RAM insuficiente (${RAM_GB}GB). Esperado ~32GB."
            exit 1
          fi

          if ! echo "$GPU_NAME" | grep -qi "3060"; then
            echo "::error::GPU não é RTX 3060 (encontrada: $GPU_NAME)"
            exit 1
          fi

          echo "✅ Hardware validado: 32GB RAM + RTX 3060"

      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
                                  python3-pip python3-venv git curl wget

      - name: Instalar CUDA Toolkit (se ainda não existir)
        run: |
          if ! command -v nvcc &> /dev/null; then
            echo "nvcc não encontrado — instalando CUDA Toolkit..."
            sudo apt-get install -y cuda-toolkit-12-4 || \
            sudo apt-get install -y cuda-toolkit
          fi
          nvcc --version || echo "CUDA não disponível no PATH"

      - name: Exemplo de teste com PyTorch + GPU
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
          python - <<'EOF'
          import torch
          print("CUDA disponível:", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("GPU:", torch.cuda.get_device_name(0))
              print("VRAM (GB):", torch.cuda.get_device_properties(0).total_memory / 1e9)
              x = torch.randn(10000, 10000, device="cuda")
              y = x @ x
              print("Matmul OK, shape:", y.shape)
          else:
              raise SystemExit("CUDA não detectado pelo PyTorch")
          EOF

      - name: Rodar o build/teste do seu projeto
        run: |
          echo "Coloque aqui seus comandos de build/teste"
